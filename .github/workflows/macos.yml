# Compile HomeRun Player pour macOS (dossier macos/) : tests du cœur, appli universelle
# arm64 + x86_64, .dmg non signé publié comme artefact ; joint à la release GitHub quand
# une release est publiée (version de l'appli = celle du tag). Ne crée jamais de release.
name: macOS

on:
  push:
    paths:
      - "macos/**"
      - "res/app.ico"
      - ".github/workflows/macos.yml"
  pull_request:
    paths:
      - "macos/**"
      - ".github/workflows/macos.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (ex. 3.7) ; vide = celle de macos/project.yml"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4

      - name: Outils
        run: |
          xcodebuild -version
          swift --version
          command -v xcodegen || brew install xcodegen
          xcodegen --version

      # Tests du cœur (playlist, guide, mises à jour, noms de fichiers, pistes) ; le scan
      # et le guide sont testés contre le faux tuner local, jamais contre un vrai.
      - name: Tests (faux tuner)
        run: |
          python3 tools/fake_tuner.py 8090 > fake_tuner.log 2>&1 &
          sleep 2
          FAKE_TUNER=http://127.0.0.1:8090 swift test
          cat fake_tuner.log

      - name: Compilation et .dmg
        run: |
          chmod +x build.sh tools/*.sh
          VER="${{ github.event.inputs.version }}"
          if [ "${{ github.event_name }}" = "release" ]; then VER="${{ github.event.release.tag_name }}"; fi
          ./build.sh "$VER" 2>&1 | tee build.out

      # Erreurs remontées en annotations (lisibles sans se connecter à GitHub).
      - name: Journal de compilation
        if: failure()
        run: |
          annot() { python3 -c 'import sys; d=sys.stdin.read()[-30000:]; print(d.replace("%","%25").replace("\r","").replace("\n","%0A"))'; }
          if [ -f build/xcodebuild.log ]; then
            grep -E "error:|Error |fatal" build/xcodebuild.log | sort -u | head -120 > errs.txt || true
            cat errs.txt
            echo "::error title=xcodebuild::$(annot < errs.txt)"
            echo "::warning title=xcodebuild (fin)::$(tail -40 build/xcodebuild.log | annot)"
          fi
          [ -f build.out ] && echo "::warning title=build.sh (fin)::$(tail -60 build.out | annot)" || true

      - uses: actions/upload-artifact@v4
        with:
          name: HomeRunPlayer-macos
          path: macos/dist/*.dmg
          if-no-files-found: error

      - name: Joindre le .dmg à la release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/*.dmg --clobber --repo "$GITHUB_REPOSITORY"
