# Compile l'APK Android de HomeRun Player (dossier android/).
name: Android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
  # Release publiée sur GitHub : l'APK (à la version de la release) y est joint.
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Le SDK Android est préinstallé sur les machines ubuntu de GitHub ($ANDROID_HOME).
      - name: SDK Android (plateforme 36)
        run: |
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilation de l'APK
        run: |
          chmod +x gradlew
          if [ "${{ github.event_name }}" = "release" ]; then
            ./gradlew assembleRelease --console=plain -PappVersion="${{ github.event.release.tag_name }}"
          else
            ./gradlew assembleRelease --console=plain
          fi

      - name: Nom du fichier
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            ver="${{ github.event.release.tag_name }}"; ver="${ver#v}"
          else
            ver=$(grep -oP '\?: "\K[0-9.]+(?="$)' app/build.gradle.kts)
          fi
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/HomeRunPlayer-$ver-android.apk"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: HomeRunPlayer-android
          path: android/dist/*.apk
          if-no-files-found: error

      # Seulement pour une release publiée (jamais créée par ce workflow).
      - name: Joindre l'APK à la release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.apk --clobber -R "${{ github.repository }}"
