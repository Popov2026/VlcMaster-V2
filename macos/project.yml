# Projet Xcode de HomeRun Player pour macOS, généré par XcodeGen :
#   xcodegen generate        (crée HomeRunPlayer.xcodeproj, non versionné)
# VLCKit.xcframework est téléchargé dans Vendor/ par tools/fetch_vlckit.sh.
name: HomeRunPlayer
options:
  bundleIdPrefix: fr.popov
  deploymentTarget:
    macOS: "11.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "3.7"
    CURRENT_PROJECT_VERSION: "1"
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: NO
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
targets:
  HomeRunPlayer:
    type: application
    platform: macOS
    scheme: {}          # schéma partagé (xcodebuild -scheme HomeRunPlayer)
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_NAME: "HomeRun Player"
        PRODUCT_BUNDLE_IDENTIFIER: fr.popov.homerun
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - framework: Vendor/VLCKit.xcframework
        embed: true
      - sdk: libiconv.tbd
